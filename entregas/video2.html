<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:K;src:url(fonts/kanit-latin-800-italic.woff2);font-weight:800;font-style:italic}
@font-face{font-family:K7;src:url(fonts/kanit-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:F;src:url(fonts/figtree-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:F7;src:url(fonts/figtree-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;background:#0A0E13}#v{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body><div id="v"></div><canvas id="out" width="1080" height="1920" style="display:none"></canvas>
<script src="vendor/three.min.js"></script><script src="vendor/GLTFLoader.js"></script><script src="vendor/OrbitControls.js"></script><script src="vendor/meshopt_decoder.js"></script><script src="vendor/CopyShader.js"></script><script src="vendor/LuminosityHighPassShader.js"></script><script src="vendor/EffectComposer.js"></script><script src="vendor/RenderPass.js"></script><script src="vendor/ShaderPass.js"></script><script src="vendor/UnrealBloomPass.js"></script><script src="vendor/GammaCorrectionShader.js"></script>
<script src="cuerpo3d.js"></script>
<script>
const W=1080,H=1920, LIMA='#C8F23A', BL='#F1F5F7', GR='#8B96A3', TT=20;
// historial de medidas (cm): semana 0, 4, 8, 12
const HIST={hombros:[112,115,119,122],brazo:[32,34,36,38],pecho:[95,98,101,104],muslo:[55,57,60,62],pantorrilla:[37,38,39,40],cadera:[95,96,98,99],antebrazo:[27,28,29,30],cuello:[37,38,38,39]};
const INI={}, HOY={}; for(const k in HIST){ INI[k]=HIST[k][0]; HOY[k]=HIST[k][3]; }
const CHIPS=[['Hombros','hombros'],['Brazo','brazo'],['Pecho','pecho'],['Muslo','muslo']];
const V=Cuerpo3D.montar(document.getElementById('v'),{captura:true,manual:true});
const out=document.getElementById('out'), x=out.getContext('2d');
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), p=(t,t0,d)=>cl((t-t0)/d), lerp=(a,b,v)=>a+(b-a)*v;
const eIO=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2, eOut=v=>1-Math.pow(1-v,3);
let T={}; window.LISTO=0;
Promise.all([V.promesa,document.fonts.load('800 italic 40px K'),document.fonts.load('700 40px K7'),document.fonts.load('600 40px F'),document.fonts.load('700 40px F7')]).then(()=>{
  const inf=V.info();
  for(const [k,g,l] of [['del','hombro','r'],['cua','cuadriceps','r']]){ const c=V.canal(g,l); T[k]={c,centro:new THREE.Vector3().fromArray(inf.canales[c].centro)}; }
  T.del.centro.x-=.03; T.del.centro.z+=.07; T.cua.centro.z+=.07;     // punto sobre la piel, no en el centro del músculo
  window.LISTO=1;
});
function camara(az,r,ty,dy){ const c=V.camera; V.controls.target.set(0,ty,0); c.position.set(Math.sin(az)*r,ty+dy,Math.cos(az)*r); c.lookAt(0,ty,0); V.controls.update(); }
function rr(x0,y0,w,h,r){ x.beginPath(); x.moveTo(x0+r,y0); x.arcTo(x0+w,y0,x0+w,y0+h,r); x.arcTo(x0+w,y0+h,x0,y0+h,r); x.arcTo(x0,y0+h,x0,y0,r); x.arcTo(x0,y0,x0+w,y0,r); x.closePath(); }
function dedo(fx,fy,a,presion){ // yema del dedo: círculo blanco translúcido
  if(a<=0) return; x.globalAlpha=a*.85; x.fillStyle='rgba(241,245,247,.35)'; x.beginPath(); x.arc(fx,fy,46-presion*8,0,7); x.fill();
  x.globalAlpha=a; x.strokeStyle='rgba(241,245,247,.9)'; x.lineWidth=3; x.stroke(); }
function onda(fx,fy,u){ if(u<=0||u>=1) return; x.globalAlpha=1-u; x.strokeStyle=LIMA; x.lineWidth=4; x.beginPath(); x.arc(fx,fy,24+u*80,0,7); x.stroke(); }
function pantalla(v3){ const s=v3.clone().project(V.camera); return [(s.x*.5+.5)*W,(-s.y*.5+.5)*H]; }
// ficha del músculo tocado, con la evolución de su medida
function ficha(a,cy,o){
  if(a<=0) return;
  const cw=W-144, cx=72, ch=420; cy+= (1-a)*30; x.globalAlpha=a;
  rr(cx,cy,cw,ch,32); x.fillStyle='rgba(16,21,28,.95)'; x.fill(); x.strokeStyle='rgba(200,242,58,.55)'; x.lineWidth=2; x.stroke();
  x.fillStyle=LIMA; x.font='700 24px F7'; x.letterSpacing='4px'; x.fillText('TOCASTE',cx+36,cy+56); x.letterSpacing='0px';
  x.fillStyle=BL; x.font='700 46px K7'; x.fillText(o.nombre,cx+36,cy+112);
  x.fillStyle=GR; x.font='600 28px F'; x.fillText(o.sub,cx+36,cy+156);
  const h=HIST[o.k], d=h[3]-h[0], pct=Math.round((h[3]/h[0]-1)*100);
  x.fillStyle=LIMA; x.font='800 italic 84px K'; x.fillText('+'+d+' cm',cx+36,cy+262);
  x.fillStyle=BL; x.font='700 30px F7'; x.fillText(o.med+' '+h[0]+' → '+h[3]+' cm',cx+36,cy+312);
  x.fillStyle=GR; x.font='600 26px F'; x.fillText('+'+pct+' % en 12 semanas',cx+36,cy+352);
  // gráfica
  const gx=cx+cw-400, gy=cy+150, gw=360, gh=200, mn=h[0]-1, mx=h[3]+1, pt=i=>[gx+i*gw/3, gy+gh-(h[i]-mn)/(mx-mn)*gh];
  x.strokeStyle='#222B35'; x.lineWidth=2; for(let i=0;i<4;i++){ const [px]=pt(i); x.beginPath(); x.moveTo(px,gy); x.lineTo(px,gy+gh); x.stroke(); }
  const dib=cl(p(o.t,.2,.9)), nseg=dib*3;
  const gr=x.createLinearGradient(0,gy,0,gy+gh); gr.addColorStop(0,'rgba(200,242,58,.28)'); gr.addColorStop(1,'rgba(200,242,58,0)');
  x.beginPath(); let [sx,sy]=pt(0); x.moveTo(sx,gy+gh); x.lineTo(sx,sy); let ex=sx;
  for(let i=1;i<=3;i++){ const f=cl(nseg-(i-1)); if(f<=0) break; const [ax,ay]=pt(i-1),[bx,by]=pt(i); ex=lerp(ax,bx,f); x.lineTo(ex,lerp(ay,by,f)); }
  x.lineTo(ex,gy+gh); x.closePath(); x.fillStyle=gr; x.fill();
  x.beginPath(); x.moveTo(sx,sy); for(let i=1;i<=3;i++){ const f=cl(nseg-(i-1)); if(f<=0) break; const [ax,ay]=pt(i-1),[bx,by]=pt(i); x.lineTo(lerp(ax,bx,f),lerp(ay,by,f)); }
  x.strokeStyle=LIMA; x.lineWidth=5; x.lineJoin='round'; x.stroke();
  for(let i=0;i<4;i++){ if(nseg<i-.05) break; const [px,py]=pt(i); x.fillStyle=i===3?LIMA:'#10151C'; x.beginPath(); x.arc(px,py,i===3?11:8,0,7); x.fill(); x.strokeStyle=LIMA; x.lineWidth=3; x.stroke();
    x.fillStyle=GR; x.font='600 22px F'; x.textAlign='center'; x.fillText('S'+(i*4),px,gy+gh+34); x.fillStyle=i===3?LIMA:BL; x.font='700 24px F7'; x.fillText(h[i],px,py-20); x.textAlign='left'; }
}
window.cuadro=function(t){
  // ── cámara y gestos ──
  let az=.3, r=6.2, ty=.72, dy=.1, fa=0, fx=0, fy=0, pr=0;
  const sw1=p(t,1.0,1.7), sw2=p(t,3.0,1.7);
  az=.3+eIO(sw1)*Math.PI+eIO(sw2)*Math.PI;                               // dos arrastres: espalda y de vuelta al frente
  if(t>0.8&&t<4.9){ const s=t<2.85?sw1:sw2; fa=cl((t-0.8)/.2)*(t<2.85?1-p(t,2.7,.15):cl((t-2.85)/.15)*(1-p(t,4.7,.2))); fx=lerp(250,830,eIO(s)); fy=1080+Math.sin(s*3.1)*24; pr=1; }
  if(t>=7.0) az=lerp(az,az+.35,eIO(p(t,7.0,1.6)));                      // giro suave mientras crece
  // acercamiento con pellizco al torso
  const zm=eIO(p(t,8.8,1.3)); r=lerp(r,2.7,zm); ty=lerp(ty,1.12,zm); az=lerp(az,az-.75,zm);
  // bajar a las piernas para el cuádriceps
  const bj=eIO(p(t,13.6,1.0)); ty=lerp(ty,.6,bj); r=lerp(r,3.1,bj); az=lerp(az,az+.25,bj);
  // alejar al final
  const fin=eIO(p(t,17.6,1.4)); r=lerp(r,6.2,fin); ty=lerp(ty,.75,fin); az=lerp(az,az+.4,fin);
  camara(az,r,ty,dy);
  const vm=eIO(p(t,5.1,1.8));
  V.mezclar(INI,HOY,vm);
  const enDel=t>=10.4&&t<13.7, enCua=t>=14.8&&t<17.6;
  V.verCrecimiento(t>=5.1 && !enDel && !enCua);
  V.resaltar(enDel?T.del.c:enCua?T.cua.c:null);
  V.cuadro(performance.now());
  // ── composición ──
  x.globalAlpha=1; x.drawImage(document.querySelector('#v canvas'),0,0,W,H);
  let g=x.createLinearGradient(0,H-640,0,H); g.addColorStop(0,'rgba(10,14,19,0)'); g.addColorStop(.42,'rgba(10,14,19,.88)'); g.addColorStop(1,'rgba(10,14,19,.98)');
  x.fillStyle=g; x.fillRect(0,H-640,W,640);
  g=x.createLinearGradient(0,0,0,360); g.addColorStop(0,'rgba(10,14,19,.95)'); g.addColorStop(1,'rgba(10,14,19,0)'); x.fillStyle=g; x.fillRect(0,0,W,360);
  const aT=eOut(p(t,.3,.6));
  x.globalAlpha=aT; x.fillStyle=LIMA; x.font='700 30px F7'; x.letterSpacing='6px'; x.fillText('MI CUERPO',72,138);
  x.letterSpacing='0px'; x.fillStyle=BL; x.font='800 italic 74px K'; x.fillText('Tus músculos,',72,222); x.fillStyle=LIMA; x.fillText('a tu medida',72,300);
  // pista de gesto
  const aP=Math.min(eOut(p(t,.6,.4)),1-p(t,4.6,.4)); if(aP>0){ x.globalAlpha=aP; x.fillStyle=GR; x.font='600 28px F'; x.fillText('Desliza para girar · pellizca para acercar',72,356); }
  // interruptor
  const enFicha=Math.max(cl(p(t,10.5,.35))*(1-p(t,13.5,.3)), cl(p(t,14.9,.35))*(1-p(t,17.5,.3)));
  x.globalAlpha=eOut(p(t,.6,.6))*(1-enFicha);
  const px0=W-72-300, py0=H-560; rr(px0,py0,300,74,37); x.fillStyle='#161C24'; x.fill();
  const sx=lerp(px0+6,px0+150,eIO(p(t,5.1,.45))); rr(sx,py0+6,144,62,31); x.fillStyle=LIMA; x.fill();
  x.font='700 26px F7'; x.textAlign='center';
  const enHoy=t>=5.3; x.fillStyle=enHoy?GR:'#0A0E13'; x.fillText('INICIO',px0+78,py0+46); x.fillStyle=enHoy?'#0A0E13':GR; x.fillText('HOY',px0+222,py0+46);
  x.textAlign='left'; x.fillStyle=GR; x.font='600 28px F'; if(x.globalAlpha>0) x.fillText(enHoy?'Semana 12':'Primera medición',72,py0+46);
  // tarjetas
  const cw=(W-144-3*20)/4;
  CHIPS.forEach(([nm,k],i)=>{
    const a=eOut(p(t,.8+i*.08,.5))*(1-enFicha); if(a<=0) return; x.globalAlpha=a;
    const cx=72+i*(cw+20), cy=H-440+(1-a)*30;
    rr(cx,cy,cw,190,26); x.fillStyle='#121820'; x.fill(); x.strokeStyle=vm>.02?'rgba(200,242,58,'+(.25+.45*vm)+')':'#222B35'; x.lineWidth=2; x.stroke();
    x.fillStyle=GR; x.font='600 26px F'; x.fillText(nm,cx+24,cy+48);
    const val=lerp(INI[k],HOY[k],vm); x.fillStyle=BL; x.font='700 60px K7'; x.fillText(val.toFixed(0),cx+24,cy+122);
    const wv=x.measureText(val.toFixed(0)).width; x.fillStyle=GR; x.font='600 26px F'; x.fillText('cm',cx+30+wv,cy+122);
    if(vm>.02){ x.globalAlpha=a*cl(vm*1.5); x.fillStyle=LIMA; x.font='700 28px F7'; x.fillText('+'+(HOY[k]-INI[k])+' cm',cx+24,cy+164); }
  });
  // fichas
  ficha(eOut(p(t,10.5,.4))*(1-p(t,13.5,.3)), H-560, {nombre:'Deltoides',sub:'Hombro derecho · porción acromial',k:'hombros',med:'Hombros',t:t-10.5});
  ficha(eOut(p(t,14.9,.4))*(1-p(t,17.5,.3)), H-560, {nombre:'Cuádriceps',sub:'Muslo derecho · vasto lateral',k:'muslo',med:'Muslo',t:t-14.9});
  // pie
  x.globalAlpha=eOut(p(t,1,.6)); x.fillStyle='#5E6873'; x.font='600 24px F';
  x.fillText('Estimación visual con tus medidas · no es un diagnóstico',72,H-110);
  x.fillText('Modelo anatómico: Z-Anatomy (CC BY-SA 4.0)',72,H-72);
  // dedo arrastrando
  x.globalAlpha=1; dedo(fx,fy,fa,pr);
  // toque en HOY
  { const u=p(t,4.85,.5); if(u>0&&u<1){ dedo(px0+222,py0+37,1-p(t,5.15,.2),1); onda(px0+222,py0+37,u); } }
  // pellizco
  if(t>8.6&&t<10.2){ const u=eIO(p(t,8.8,1.3)), a=cl((t-8.6)/.2)*(1-p(t,10.0,.2)); const cx=W/2, cy=760, d=lerp(60,240,u); dedo(cx-d*.7,cy+d*.7,a,1); dedo(cx+d*.7,cy-d*.7,a,1); }
  // toques en músculos
  for(const [k,t0] of [['del',10.1],['cua',14.5]]){
    if(t<t0||t>t0+3.4) continue;
    const [bx,by]=pantalla(T[k].centro);
    dedo(bx,by,1-p(t,t0+.25,.2),1); onda(bx,by,p(t,t0,.7));
    if(t>t0+.35){ const a=eOut(p(t,t0+.35,.4))*(1-p(t,t0+3.05,.3)); x.globalAlpha=a; x.fillStyle=LIMA; x.beginPath(); x.arc(bx,by,10,0,7); x.fill();
      x.strokeStyle='rgba(200,242,58,.7)'; x.lineWidth=3; x.beginPath(); x.moveTo(bx,by+12); x.lineTo(bx,H-560); x.stroke(); }
  }
  x.globalAlpha=1;
  const negro=Math.max(1-p(t,0,.5), p(t,TT-.45,.45));
  if(negro>0){ x.fillStyle='rgba(0,0,0,'+negro+')'; x.fillRect(0,0,W,H); }
  return out.toDataURL('image/png');
};
</script></body></html>
